<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 780px;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: #3b5bdb;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .chat-header-info h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .chat-header-info p {
      font-size: 12px;
      opacity: 0.82;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #69db7c;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      background: #dee2f5;
    }

    .message.user .message-avatar { background: #3b5bdb; color: #fff; }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.bot .message-bubble {
      background: #f1f3f9;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: #3b5bdb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Quick reply chips */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 8px;
      flex-shrink: 0;
    }

    .quick-reply-chip {
      background: #eef0fb;
      border: 1px solid #c5caf5;
      color: #3b5bdb;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .quick-reply-chip:hover {
      background: #dde1f8;
      transform: translateY(-1px);
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 16px 4px;
      flex-shrink: 0;
    }

    .typing-indicator.visible { display: flex; }

    .typing-dots {
      display: flex;
      gap: 4px;
      background: #f1f3f9;
      padding: 8px 14px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: #aab0cc;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40%            { transform: scale(1.1); opacity: 1;   }
    }

    /* Input area */
    .chat-input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid #e8eaf0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #dde1f8;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #3b5bdb; }

    #send-btn {
      width: 40px;
      height: 40px;
      background: #3b5bdb;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover { background: #2f4cc4; transform: scale(1.05); }
    #send-btn:active { transform: scale(0.96); }

    #send-btn svg { fill: #fff; width: 18px; height: 18px; }

    /* Human handoff banner */
    .handoff-banner {
      display: none;
      margin: 0 16px 12px;
      background: #fff9db;
      border: 1px solid #ffe066;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #7a5c00;
      line-height: 1.5;
    }

    .handoff-banner.visible { display: block; }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="bot-avatar">📚</div>
    <div class="chat-header-info">
      <h1>Study Buddy Bot</h1>
      <p><span class="status-dot"></span>Here to help you learn — not do the work for you</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages"></div>

  <!-- Typing indicator -->
  <div class="typing-indicator" id="typing-indicator">
    <div style="width:30px;height:30px;border-radius:50%;background:#dee2f5;display:flex;align-items:center;justify-content:center;font-size:14px;">📚</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Human handoff banner -->
  <div class="handoff-banner" id="handoff-banner">
    🙋 <strong>Connecting you to a human advisor…</strong><br>
    A real person will be with you shortly. In the meantime, feel free to keep chatting or try rephrasing your question.
  </div>

  <!-- Quick reply chips -->
  <div class="quick-replies" id="quick-replies"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea id="user-input" placeholder="Ask me anything about your studies…" rows="1"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // ─── State ────────────────────────────────────────────────────────────────
  const state = {
    subject: null,          // currently tracked subject/topic
    failedAttempts: 0,      // consecutive misunderstood questions
    handedOff: false,       // true after human handoff triggered
  };

  // ─── Helpers ──────────────────────────────────────────────────────────────
  const messagesEl    = document.getElementById('chat-messages');
  const typingEl      = document.getElementById('typing-indicator');
  const inputEl       = document.getElementById('user-input');
  const sendBtn       = document.getElementById('send-btn');
  const quickRepliesEl = document.getElementById('quick-replies');
  const handoffBanner = document.getElementById('handoff-banner');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(text, who) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('message', who);

    const avatar = document.createElement('div');
    avatar.classList.add('message-avatar');
    avatar.textContent = who === 'bot' ? '📚' : '🧑';

    const bubble = document.createElement('div');
    bubble.classList.add('message-bubble');
    bubble.textContent = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  function showTyping() {
    typingEl.classList.add('visible');
    scrollToBottom();
  }

  function hideTyping() {
    typingEl.classList.remove('visible');
  }

  function setQuickReplies(chips) {
    quickRepliesEl.innerHTML = '';
    chips.forEach(label => {
      const btn = document.createElement('button');
      btn.classList.add('quick-reply-chip');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        setQuickReplies([]);
        handleUserMessage(label);
      });
      quickRepliesEl.appendChild(btn);
    });
  }

  function triggerHandoff() {
    state.handedOff = true;
    handoffBanner.classList.add('visible');
    inputEl.disabled = true;
    sendBtn.disabled = true;
    inputEl.placeholder = 'Chat disabled — a human advisor will take over.';
    setQuickReplies([]);
  }

  // ─── Intent detection ─────────────────────────────────────────────────────
  function detectIntent(text) {
    const t = text.toLowerCase().trim();

    // Cheating / doing work for them
    if (/\b(do my|write my|complete my|finish my|solve my|answer my|write for me|do for me|take my|sit my|cheat)\b/.test(t) &&
        /\b(assignment|homework|exam|test|quiz|essay|coursework|project|paper)\b/.test(t)) {
      return 'CHEAT';
    }
    if (/\b(write (the|an?|my) (essay|report|paper|assignment)|do (the|my) homework)\b/.test(t)) {
      return 'CHEAT';
    }

    // Non-academic / off-topic
    if (/\b(recipe|movie|weather|sport|joke|dating|relationship|celebrity|gossip|news|stock|crypto|invest)\b/.test(t)) {
      return 'OFF_TOPIC';
    }

    // Explain a topic
    if (/\b(explain|what is|what are|define|tell me about|describe|meaning of|concept of)\b/.test(t)) {
      return 'EXPLAIN';
    }

    // Break down a formula / equation
    if (/\b(formula|equation|break(?: it)? down|break down|don'?t understand|simplify|how does .* work|how do i (use|apply|calculate))\b/.test(t)) {
      return 'FORMULA';
    }

    // Practice question
    if (/\b(practice|quiz me|test me|give me (a |an )?question|example question|mock question|exercise)\b/.test(t)) {
      return 'PRACTICE';
    }

    // Greeting
    if (/^(hi|hello|hey|howdy|hiya|good (morning|afternoon|evening))[!.,]?$/.test(t)) {
      return 'GREET';
    }

    // Set subject shortcut ("my subject is X" / "topic is X")
    if (/\b(my (subject|topic|course) is|studying|i('m| am) studying|i study)\b/.test(t)) {
      return 'SET_SUBJECT';
    }

    return 'UNKNOWN';
  }

  // Pull a topic from the user's message (best-effort)
  function extractTopic(text) {
    const patterns = [
      /(?:explain|about|on|regarding|for|understand|studying)\s+(.+?)(?:\?|$|,|\.|please|can you)/i,
      /(?:my subject is|topic is|studying|i study)\s+(.+?)(?:\?|$|,|\.)/i,
      /(?:formula for|equation for)\s+(.+?)(?:\?|$|,|\.)/i,
      /(?:practice|quiz me on|question on|question about)\s+(.+?)(?:\?|$|,|\.)/i,
    ];
    for (const re of patterns) {
      const m = text.match(re);
      if (m && m[1].trim().length > 1) return m[1].trim();
    }
    return null;
  }

  // ─── Response builders ────────────────────────────────────────────────────
  function buildExplainResponse(topic) {
    return `Great question! Here's a simple breakdown of "${topic}":\n\n` +
      `1. Start with the core idea — what is ${topic} fundamentally about?\n` +
      `2. Think of a real-world analogy that clicks for you.\n` +
      `3. Break it into its key components or steps.\n\n` +
      `Can you tell me a little more about what specifically confuses you about ${topic}? ` +
      `That way I can tailor my explanation to exactly what you need. 🎯`;
  }

  function buildFormulaResponse(topic) {
    const t = topic || 'this formula';
    return `Let's break down ${t} step by step:\n\n` +
      `• What does each symbol/variable represent?\n` +
      `• What is the formula actually calculating or describing?\n` +
      `• How would you apply it to a simple example?\n\n` +
      `If you paste the formula here I can walk you through it in detail — ` +
      `what does each part look like to you so far?`;
  }

  function buildPracticeResponse(topic) {
    const t = topic || 'your topic';
    return `Here's a practice question on ${t}:\n\n` +
      `❓ Think about a key concept or process in ${t}. ` +
      `Can you explain it in your own words, and give one real-world example where it applies?\n\n` +
      `Try answering it first — then share your answer with me and I'll give you feedback! 💪`;
  }

  function buildSetSubjectResponse(topic) {
    state.subject = topic;
    return `Got it — I've noted that you're studying ${topic}. 📝\n\n` +
      `How can I help? You can ask me to:\n` +
      `• Explain a concept in simple terms\n` +
      `• Break down a formula or equation\n` +
      `• Give you a practice question`;
  }

  function buildGreetResponse() {
    if (state.subject) {
      return `Hey! Good to see you again. We're working on ${state.subject} — what would you like to tackle today?`;
    }
    return `Hi there! 👋 I'm Study Buddy Bot.\n\n` +
      `I'm here to help you understand your subject — not do your homework for you! 😄\n\n` +
      `What subject or topic are you studying?`;
  }

  // ─── Core responder ───────────────────────────────────────────────────────
  function getResponse(text) {
    if (state.handedOff) {
      return "You've been connected to a human advisor. They'll take it from here! 🙋";
    }

    const intent  = detectIntent(text);
    const topicFromMsg = extractTopic(text);
    const topic   = topicFromMsg || state.subject;

    // Update subject if a new one is mentioned
    if (topicFromMsg && intent !== 'CHEAT' && intent !== 'OFF_TOPIC') {
      state.subject = topicFromMsg;
    }

    switch (intent) {
      case 'GREET':
        state.failedAttempts = 0;
        return { text: buildGreetResponse(), chips: ['Explain a concept', 'Break down a formula', 'Give me a practice question'] };

      case 'SET_SUBJECT':
        state.failedAttempts = 0;
        if (topic) {
          return { text: buildSetSubjectResponse(topic), chips: ['Explain it to me', 'Give me a practice question', 'Break down a formula'] };
        }
        return { text: "What subject or topic are you studying? I'd love to help once I know where to focus!" };

      case 'EXPLAIN':
        state.failedAttempts = 0;
        if (!topic) {
          return {
            text: "I'd love to explain that! What subject or topic should I focus on?",
            chips: ['Mathematics', 'Physics', 'Biology', 'Chemistry', 'History', 'Literature']
          };
        }
        return { text: buildExplainResponse(topic), chips: ['Give me a practice question', 'Break it down further', 'Try another topic'] };

      case 'FORMULA':
        state.failedAttempts = 0;
        if (!topic) {
          return { text: "Sure! Paste the formula or tell me which subject it's from, and I'll walk you through it." };
        }
        return { text: buildFormulaResponse(topic), chips: ['Give me a practice question', 'Explain another concept'] };

      case 'PRACTICE':
        state.failedAttempts = 0;
        if (!topic) {
          return {
            text: "I'll quiz you! Which subject or topic should the question be on?",
            chips: ['Mathematics', 'Physics', 'Biology', 'Chemistry', 'History', 'Literature']
          };
        }
        return { text: buildPracticeResponse(topic), chips: ['Another question', 'Explain this topic', 'Different topic'] };

      case 'CHEAT':
        state.failedAttempts = 0;
        // Immediately hand off
        setTimeout(() => triggerHandoff(), 2200);
        return {
          text: "I'm afraid I can't do your assignment or exam for you — that wouldn't actually help you learn, and it wouldn't be fair to you or your institution. 🎓\n\n" +
                "What I *can* do is explain the concepts, break down tricky parts, and give you practice questions so you're ready to tackle it yourself.\n\n" +
                "That said, since this seems to go beyond study support, I'm going to connect you with a human advisor who may be better placed to help. One moment…"
        };

      case 'OFF_TOPIC':
        state.failedAttempts = 0;
        setTimeout(() => triggerHandoff(), 2200);
        return {
          text: "That's a bit outside my lane as a study assistant — I'm best at academic topics like explanations, formulas, and practice questions. 📚\n\n" +
                "For this one, let me connect you with a human who can point you in the right direction!"
        };

      case 'UNKNOWN':
      default:
        state.failedAttempts++;
        if (state.failedAttempts >= 2) {
          // Offer to connect to a human
          setTimeout(() => {
            addMessage(
              "I've had trouble understanding your last couple of messages. Would you like me to connect you with a human advisor instead?",
              'bot'
            );
            setQuickReplies(['Yes, connect me to a human', 'No, let me rephrase']);
          }, 800);
          return null; // response handled async
        }
        return {
          text: "Hmm, I'm not quite sure I understood that. 🤔\n\n" +
                "I can help you with:\n• Explaining a concept in simple terms\n• Breaking down a formula\n• Giving you a practice question\n\nCould you try rephrasing, or let me know what subject you're working on?",
          chips: ['Explain a topic', 'Break down a formula', 'Give me a practice question']
        };
    }
  }

  // ─── Send flow ────────────────────────────────────────────────────────────
  function handleUserMessage(text) {
    const clean = text.trim();
    if (!clean) return;

    // Handle human handoff confirmation
    if (clean.toLowerCase().includes('yes, connect me')) {
      addMessage(clean, 'user');
      showTyping();
      setTimeout(() => {
        hideTyping();
        addMessage("Of course! Connecting you to a human advisor now. They'll be able to help you more directly. 🙋", 'bot');
        triggerHandoff();
      }, 1000);
      return;
    }

    if (clean.toLowerCase().includes('no, let me rephrase')) {
      addMessage(clean, 'user');
      showTyping();
      setTimeout(() => {
        hideTyping();
        state.failedAttempts = 0;
        addMessage("No problem! Take your time rephrasing — I'm all ears. What are you trying to find out?", 'bot');
        setQuickReplies(['Explain a topic', 'Break down a formula', 'Give me a practice question']);
      }, 1000);
      return;
    }

    addMessage(clean, 'user');
    setQuickReplies([]);
    showTyping();

    // Simulate bot thinking delay (400–900ms)
    const delay = 400 + Math.random() * 500;

    setTimeout(() => {
      hideTyping();
      const response = getResponse(clean);
      if (response === null) return; // handled asynchronously in getResponse
      if (typeof response === 'string') {
        addMessage(response, 'bot');
      } else {
        addMessage(response.text, 'bot');
        if (response.chips && response.chips.length) {
          setQuickReplies(response.chips);
        }
      }
    }, delay);
  }

  // ─── Event listeners ──────────────────────────────────────────────────────
  sendBtn.addEventListener('click', () => {
    handleUserMessage(inputEl.value);
    inputEl.value = '';
    inputEl.style.height = 'auto';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleUserMessage(inputEl.value);
      inputEl.value = '';
      inputEl.style.height = 'auto';
    }
  });

  // Auto-grow textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });

  // ─── Boot ─────────────────────────────────────────────────────────────────
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(
        "Hi there! 👋 I'm Study Buddy Bot.\n\n" +
        "I'm here to help you understand your subject — not do your homework for you! 😄\n\n" +
        "What subject or topic are you studying right now?",
        'bot'
      );
      setQuickReplies(['Mathematics', 'Physics', 'Biology', 'Chemistry', 'History', 'Literature']);
    }, 900);
  }, 400);
</script>
</body>
</html>
