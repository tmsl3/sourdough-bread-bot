<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sourdough Bread Bot 🍞</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #fdf6ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-shell {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      min-height: 500px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e8ddc8;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: #7c4b1e;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .chat-header-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25));
    }
    .chat-header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .chat-header-text p {
      font-size: 12px;
      color: #e8c89a;
      margin-top: 2px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #5dd97c;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    /* ── Messages ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 90%;
      animation: fadeUp 0.18s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #7c4b1e;
      color: #fff;
      font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: #3b82d4; font-size: 13px; font-weight: 700; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.65;
      color: #1f2328;
      max-width: 100%;
      word-break: break-word;
    }
    .msg.bot .bubble {
      background: #fdf6ec;
      border: 1px solid #e8ddc8;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #7c4b1e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble strong { font-weight: 600; }
    .bubble ul { padding-left: 18px; margin-top: 6px; }
    .bubble li { margin-bottom: 3px; }
    .bubble .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      background: #e8c89a;
      color: #7c4b1e;
      border-radius: 6px;
      padding: 1px 7px;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .bubble .cheerful {
      margin-top: 8px;
      color: #7c4b1e;
      font-style: italic;
      font-size: 13.5px;
    }
    .msg.user .bubble .cheerful { color: #e8c89a; }

    /* typing indicator */
    .typing-bubble {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 16px;
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      background: #b89970;
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Suggestion chips ── */
    .chips-row {
      padding: 6px 20px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    .chip {
      background: #fdf0e0;
      border: 1px solid #e0c8a0;
      color: #7c4b1e;
      font-size: 12.5px;
      border-radius: 20px;
      padding: 5px 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: #f0dfc0; border-color: #c8a870; }

    /* ── Input row ── */
    .chat-input-row {
      display: flex;
      padding: 12px 16px 14px;
      gap: 10px;
      border-top: 1px solid #e8ddc8;
      flex-shrink: 0;
      background: #fff;
    }
    #user-input {
      flex: 1;
      border: 1px solid #d8ccc0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fdf9f5;
      color: #1f2328;
      resize: none;
      height: 42px;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #7c4b1e; }
    #send-btn {
      background: #7c4b1e;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px; height: 42px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #5e3815; }
    #send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
<div class="chat-shell">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-icon">🍞</div>
    <div class="chat-header-text">
      <h1>Sourdough Bread Bot</h1>
      <p><span class="status-dot"></span>Here to help you understand the science of sourdough</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages"></div>

  <!-- Suggestion Chips -->
  <div class="chips-row" id="chips-row">
    <button class="chip" data-q="How does sourdough bread work?">How does sourdough work?</button>
    <button class="chip" data-q="What happens during fermentation?">What happens during fermentation?</button>
    <button class="chip" data-q="What role does the starter play?">What is a starter?</button>
    <button class="chip" data-q="Why does hydration matter in sourdough?">Why does hydration matter?</button>
    <button class="chip" data-q="How do I know when proofing is complete?">How do I know proofing is done?</button>
    <button class="chip" data-q="Why do bakers score the dough?">Why score the dough?</button>
    <button class="chip" data-q="What is the benefit of baking with steam?">Why bake with steam?</button>
    <button class="chip" data-q="How can I improve crust color?">How to improve crust color?</button>
  </div>

  <!-- Input -->
  <div class="chat-input-row">
    <input type="text" id="user-input" placeholder="Ask something about sourdough…" autocomplete="off" />
    <button id="send-btn" title="Send">&#10148;</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let strikeCount = 0;       // consecutive "didn't understand" strikes
let awaitingTopic = false; // bot asked for a topic, waiting for it

// ─────────────────────────────────────────────
//  Knowledge base
// ─────────────────────────────────────────────
const KB = [
  {
    keys: ["how does sourdough work","how sourdough bread work","explain sourdough","science of sourdough","how is sourdough made"],
    tag: "The Science",
    answer: `Sourdough is a living chemistry project! The magic comes from two groups of microorganisms living in your starter: <strong>wild yeasts</strong> and <strong>lactic acid bacteria (LAB)</strong>.<br><br>
<ul>
  <li>🌾 <strong>Wild yeasts</strong> (mainly <em>Saccharomyces</em> and <em>Kazachstania</em>) eat sugars in the flour and produce <strong>CO₂ gas</strong> — that's what makes your dough rise.</li>
  <li>🦠 <strong>LAB</strong> (like <em>Lactobacillus</em>) produce <strong>lactic and acetic acids</strong>, giving sourdough its signature tang and also acting as a natural preservative.</li>
  <li>🔗 <strong>Gluten</strong> (formed when water hydrates flour proteins) traps those gas bubbles, building the open crumb structure you love.</li>
</ul>`,
    cheerful: "Happy baking! 🍞"
  },
  {
    keys: ["fermentation","what happens during","bulk ferment","autolyse","bulk rise"],
    tag: "Fermentation",
    answer: `Fermentation is where the real flavour magic happens! Think of it as the dough "waking up and getting to work." It happens in two main stages:<br><br>
<ul>
  <li>🌡️ <strong>Bulk fermentation</strong>: After mixing, the dough rests (typically 4–12 hours depending on temperature). Yeast produces CO₂ expanding the dough; bacteria produce acids building flavour.</li>
  <li>💤 <strong>Cold retard (final proof)</strong>: The shaped dough rests in the fridge overnight. Slow, cold fermentation concentrates acidity and develops complex flavour — like slow-cooking vs. fast-cooking.</li>
</ul>
Temperature is the main dial: <strong>warmer = faster, more acidic; cooler = slower, more complex.</strong>`,
    cheerful: "Experiment with timing — every kitchen is a little different! 🌡️"
  },
  {
    keys: ["starter","levain","what is a starter","role does the starter","wild culture","feeding starter","maintain starter"],
    tag: "The Starter",
    answer: `The starter is your <strong>living leavening agent</strong> — a fermented mixture of flour and water that's home to wild yeasts and lactic acid bacteria.<br><br>
Think of it like a sourdough "pet" 🐾:<br><br>
<ul>
  <li>🍽️ You <strong>feed it</strong> fresh flour and water regularly to keep the microbes healthy and active.</li>
  <li>⚡ A <strong>ripe, active starter</strong> (peaked and bubbly) gives maximum lift and flavour.</li>
  <li>📊 The <strong>hydration</strong> of your starter (equal weights flour/water = 100% hydration) influences yeast vs. bacterial balance — stiffer starters favour acetic acid (more tang); wetter starters favour lactic acid (more yogurt-like).</li>
</ul>
A healthy starter is your single biggest tool for great bread.`,
    cheerful: "Keep your starter happy and it'll keep you baking! Happy baking! 🍞"
  },
  {
    keys: ["hydration","why does hydration","hydration matter","dough hydration","wet dough","dry dough","water percentage","water ratio"],
    tag: "Hydration",
    answer: `Hydration in sourdough is the ratio of water to flour by weight. A 75% hydration dough has 75g of water per 100g of flour.<br><br>
<strong>Why it matters:</strong><br>
<ul>
  <li>💧 <strong>Higher hydration (78–90%)</strong>: More open, irregular crumb; requires more skill to shape (slacker, stickier dough); promotes faster fermentation.</li>
  <li>🪨 <strong>Lower hydration (65–72%)</strong>: Tighter, easier-to-handle dough; denser crumb; more forgiving for beginners.</li>
  <li>🌾 <strong>Flour matters too!</strong> Whole grain and high-protein flours absorb more water, so the "same" 75% can feel very different depending on your flour.</li>
</ul>
Start at 70–72% if you're learning. You can increase as your technique improves.`,
    cheerful: "Think of hydration as a difficulty setting — start easy, level up! 😄"
  },
  {
    keys: ["proofing","proof","when is it done","how do I know when proofing","final proof","over proof","under proof","poke test"],
    tag: "Proofing",
    answer: `Proofing is the final rise of your shaped dough. Nailing it is one of the most important skills in sourdough.<br><br>
<strong>Signs it's ready:</strong><br>
<ul>
  <li>🤏 <strong>Poke test</strong>: Gently poke the dough with a floured finger. It should spring back <em>slowly</em> (about 2–3 seconds), leaving a small indent. Springs back instantly = underproofed. Doesn't spring back = overproofed.</li>
  <li>📐 <strong>Volume increase</strong>: Roughly 50–75% larger than shaped size (not doubled, unlike commercial yeast).</li>
  <li>🫧 <strong>Visible bubbles</strong>: You can see small bubbles just below the surface — a sign of active fermentation throughout.</li>
  <li>🪵 <strong>Jiggle test</strong>: Shake the banneton lightly — a properly proofed loaf wobbles like jelly, not solid.</li>
</ul>`,
    cheerful: "Practice makes perfect — every loaf teaches you something new! Happy baking! 🍞"
  },
  {
    keys: ["score","scoring","why do bakers score","why score","slash","lame","ear","oven spring"],
    tag: "Scoring",
    answer: `Scoring is the art of slashing the dough's surface just before it goes into the oven. It's both practical and creative! 🎨<br><br>
<strong>Why it matters:</strong><br>
<ul>
  <li>💨 <strong>Controlled expansion</strong>: As the dough hits oven heat, CO₂ expands rapidly (oven spring). Without a score, the loaf bursts unpredictably along weak spots.</li>
  <li>👂 <strong>The "ear"</strong>: A single deep score at an angle creates that beautiful raised flap called an ear — a sign of good oven spring and proper proofing.</li>
  <li>🌡️ <strong>Heat distribution</strong>: Scores open up the interior, allowing heat to reach the crumb evenly.</li>
</ul>
Use a sharp lame or razor blade, score decisively at 30–45°, and don't hesitate — a confident slash gives a better result than a timid one.`,
    cheerful: "Score boldly! Happy baking! 🍞"
  },
  {
    keys: ["steam","benefit of steam","baking with steam","dutch oven","covered bake","crust","steam in oven"],
    tag: "Steam & Baking",
    answer: `Steam in the first phase of baking is one of sourdough's biggest secrets! 💨<br><br>
<strong>Here's why it's so important:</strong><br>
<ul>
  <li>🏃 <strong>Keeps the crust pliable</strong>: Steam prevents the outer skin from setting too early, allowing maximum oven spring before the crust locks in.</li>
  <li>✨ <strong>Gelatinises surface starch</strong>: Steam gelatinises the starch on the dough's surface, which later caramelises into a glossy, blistered, crackly crust.</li>
  <li>🍳 <strong>Dutch oven method</strong>: Baking in a covered cast iron pot traps the bread's own steam perfectly for the first 20 minutes, then you remove the lid to brown and crisp the crust.</li>
</ul>`,
    cheerful: "A good crust starts with great steam! Happy baking! 🍞"
  },
  {
    keys: ["crust color","improve crust","dark crust","golden crust","maillard","caramelise","caramelize","blistered crust","crust too pale","crust colour"],
    tag: "Crust Color",
    answer: `A deep, mahogany crust is the hallmark of great sourdough. Color comes from two reactions:<br><br>
<ul>
  <li>🧪 <strong>Maillard reaction</strong>: Amino acids + reducing sugars → hundreds of complex flavour and colour compounds. Happens from ~140°C / 285°F.</li>
  <li>🍬 <strong>Caramelisation</strong>: Sugars brown at around 160°C / 320°F, adding sweetness and depth.</li>
</ul>
<strong>Tips to improve crust color:</strong><br>
<ul>
  <li>🌡️ Bake at a higher temperature (230–250°C / 450–480°F).</li>
  <li>⏱️ Remove the Dutch oven lid for the last 20–25 minutes and keep baking until deep brown.</li>
  <li>💧 Well-fermented dough has more sugars available → more colour.</li>
  <li>🌾 Add a small amount of whole wheat flour — it darkens beautifully.</li>
  <li>🔻 Lower your oven rack so the bottom gets more heat.</li>
</ul>`,
    cheerful: "Don't be afraid of color — that deep brown is pure flavour! Happy baking! 🍞"
  }
];

// ─────────────────────────────────────────────
//  Refusal topics
// ─────────────────────────────────────────────
const BAKE_PATTERNS = [/bake (the bread|it|for me|my bread)/i, /make (the bread|it|sourdough) for me/i, /can you bake/i];
const ASSIGNMENT_PATTERNS = [/do my (assignment|homework|exam|test|quiz)/i, /write (my|the) (essay|report|assignment)/i, /answer (my|the) (exam|test|assignment)/i, /complete (my|the) (assignment|homework)/i, /can you (do|write|complete) (my|this) (essay|homework|assignment|exam|report)/i];
const OFF_TOPIC_PATTERNS = [/weather/i, /recipe for (pizza|pasta|cake|cookies|chicken)/i, /stock (market|price)/i, /sports/i, /politics/i, /celebrity/i, /movie/i, /\bChatGPT\b/i];

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function normalize(text) {
  return text.toLowerCase().replace(/['']/g, "'").replace(/[^a-z0-9 ']/g, " ").replace(/\s+/g, " ").trim();
}

function matchKB(text) {
  const n = normalize(text);
  for (const entry of KB) {
    if (entry.keys.some(k => n.includes(k))) return entry;
  }
  // fuzzy: check individual words from keys
  for (const entry of KB) {
    const allWords = entry.keys.join(" ");
    const keywords = [...new Set(allWords.split(" ").filter(w => w.length > 4))];
    const matched = keywords.filter(w => n.includes(w));
    if (matched.length >= 2) return entry;
  }
  return null;
}

function isRefusal_Bake(text) { return BAKE_PATTERNS.some(p => p.test(text)); }
function isRefusal_Assignment(text) { return ASSIGNMENT_PATTERNS.some(p => p.test(text)); }
function isRefusal_OffTopic(text) { return OFF_TOPIC_PATTERNS.some(p => p.test(text)); }

// ─────────────────────────────────────────────
//  Response logic
// ─────────────────────────────────────────────
function getBotResponse(userText) {
  const t = userText.trim();

  // — Greetings
  if (/^(hi|hello|hey|howdy|good (morning|afternoon|evening)|what('s| is) up|sup)\b/i.test(t)) {
    strikeCount = 0;
    awaitingTopic = true;
    return {
      tag: null,
      answer: `Hello there, fellow bread explorer! 👋 I'm <strong>Sourdough Bread Bot</strong>, here to help you understand the science and craft of sourdough — from wild yeast to crackly crusts!<br><br>
What sourdough topic would you like to explore today? Feel free to ask anything, or tap one of the suggestion buttons below.`,
      cheerful: null
    };
  }

  // — Thank you
  if (/^(thanks|thank you|cheers|awesome|perfect|great|that('s| was) helpful)/i.test(t)) {
    strikeCount = 0;
    return {
      tag: null,
      answer: `You're so welcome! 😊 Every question gets you one step closer to that perfect loaf. Anything else you'd like to dig into?`,
      cheerful: "Happy baking! 🍞"
    };
  }

  // — Bake for me (hard refusal)
  if (isRefusal_Bake(t)) {
    strikeCount = 0;
    return {
      tag: "🚫 Can't Do That!",
      answer: `Ha — I wish I had hands! 😄 I'm a <em>teaching</em> bot, so I can't actually bake bread for you. But I can explain every step of the process so <em>you</em> can bake an amazing loaf yourself!<br><br>
Would you like to learn how sourdough works, how to manage fermentation, or something else? If you need hands-on help, I can connect you with a human instructor — just say the word.`,
      cheerful: null
    };
  }

  // — Assignment / exam (hard refusal → handoff)
  if (isRefusal_Assignment(t)) {
    strikeCount = 0;
    return {
      tag: "🚫 That's Your Work!",
      answer: `I'm here to help you <strong>understand</strong> sourdough, not to do your work for you — that wouldn't actually help you learn! 📚<br><br>
I'd be happy to explain any <em>concept</em> your assignment covers. For anything beyond that, I'll hand you off to a human instructor who can guide you properly.`,
      cheerful: null
    };
  }

  // — Off-topic (hard refusal → handoff)
  if (isRefusal_OffTopic(t)) {
    strikeCount = 0;
    return {
      tag: "Off-Topic",
      answer: `That's a bit outside my flour-dusted world! 🌾 I'm specialised in sourdough bread science and I don't want to give you inaccurate information on other topics.<br><br>
I'll pass you along to a human who can help with that. In the meantime, can I answer anything about sourdough?`,
      cheerful: null
    };
  }

  // — If bot previously asked for a topic, treat anything as a topic cue
  if (awaitingTopic) {
    awaitingTopic = false;
    const entry = matchKB(t);
    if (entry) {
      strikeCount = 0;
      return entry;
    }
    // Didn't match even as a topic — fall through to strike logic below
  }

  // — Knowledge base match
  const entry = matchKB(t);
  if (entry) {
    strikeCount = 0;
    return entry;
  }

  // — No match: Two-Strike Rule
  strikeCount++;
  if (strikeCount === 1) {
    awaitingTopic = true;
    return {
      tag: "Hmm… 🤔",
      answer: `I'm not quite sure I caught that! Sourdough has a big vocabulary, so let me make sure I understand.<br><br>
Could you rephrase or tell me which sourdough topic you're curious about? For example:<br>
<ul>
  <li>Starter & fermentation</li>
  <li>Hydration & dough handling</li>
  <li>Proofing & shaping</li>
  <li>Scoring & baking</li>
  <li>Crust & flavour</li>
</ul>`,
      cheerful: null
    };
  } else {
    // Second strike → offer human handoff
    strikeCount = 0;
    return {
      tag: "Let's Get You Help",
      answer: `I'm sorry, I've had two goes and I'm still not sure I understand your question — and I don't want to give you wrong information! 🙏<br><br>
It's probably best I <strong>connect you with a human expert</strong> who can help you more precisely. You can reach one of our instructors at:<br><br>
📧 <strong>support@sourdoughlearning.example.com</strong><br><br>
In the meantime, if there's a different sourdough topic I can help with, I'm still here!`,
      cheerful: null
    };
  }
}

// ─────────────────────────────────────────────
//  DOM rendering
// ─────────────────────────────────────────────
const messagesEl = document.getElementById("chat-messages");
const inputEl    = document.getElementById("user-input");
const sendBtn    = document.getElementById("send-btn");

function addMessage(role, content) {
  const wrapper = document.createElement("div");
  wrapper.className = `msg ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "bot" ? "🍞" : "You";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = content;

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBotMessage(response) {
  let html = "";
  if (response.tag) html += `<span class="tag">${response.tag}</span><br>`;
  html += response.answer;
  if (response.cheerful) html += `<p class="cheerful">${response.cheerful}</p>`;
  addMessage("bot", html);
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "msg bot";
  wrapper.id = "typing-indicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "🍞";

  const bubble = document.createElement("div");
  bubble.className = "bubble typing-bubble";
  bubble.innerHTML = "<span></span><span></span><span></span>";

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function sendMessage(text) {
  if (!text.trim()) return;
  addMessage("user", text);
  inputEl.value = "";
  showTyping();

  setTimeout(() => {
    removeTyping();
    const response = getBotResponse(text);
    addBotMessage(response);
  }, 520 + Math.random() * 300);
}

sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); }
});

// Suggestion chips
document.getElementById("chips-row").addEventListener("click", e => {
